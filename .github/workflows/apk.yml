name: apk
on:
  push:
    branches: [apk-build]
    paths: ['android-build/**', '.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: pip install pillow
      - run: bash android-build/build.sh
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
      - name: Publish built APK (signing key only in encrypted form)
        run: |
          mkdir -p out-apk && mv al-mustashar-*.apk out-apk/
          # stable download name for download.html (only when the owner key signed it; TEMPKEY builds are never published under it)
          for f in out-apk/al-mustashar-*.apk; do case "$f" in *TEMPKEY*) ;; *) cp "$f" out-apk/al-mustashar.apk;; esac; done
          (cd out-apk && sha256sum * > SHA256SUMS.txt)
          git config user.name apk; git config user.email apk@users.noreply.github.com
          git checkout --orphan apk-built
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f out-apk
          git commit -qm "apk built"
          git push -f origin apk-built
