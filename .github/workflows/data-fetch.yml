name: data-fetch
on:
  push:
    branches: [data-fetch-work]
    paths: ['.github/workflows/data-fetch.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch EPA PPIS raw files (official)
        run: |
          mkdir -p out/epa out/eu
          for f in product formula chemcas chemname ctreason; do
            curl -sS -L -m 120 -A "AlMustashar-datafetch/1.0 (bob66aker@gmail.com)" -o out/epa/$f.zip "https://www3.epa.gov/pesticides/PPISdata/$f.zip" -w "$f %{http_code} %{size_download}\n"
            (cd out/epa && unzip -o -q $f.zip && rm $f.zip) || true
          done
          ls -la out/epa
      - name: Probe EU sources
        run: |
          UA="AlMustashar-datafetch/1.0 (bob66aker@gmail.com)"
          for u in \
            "https://data.europa.eu/api/hub/repo/datasets/pesticides.jsonld" \
            "https://data.europa.eu/api/hub/search/datasets/pesticides" \
            "https://ec.europa.eu/food/plant/pesticides/eu-pesticides-database/start/screen/active-substances" \
            "https://ec.europa.eu/food/plant/pesticides/eu-pesticides-database/start/screen/mrls/download" \
            "https://food.ec.europa.eu/plants/pesticides/eu-pesticides-database_en"; do
            n=$(echo "$u" | md5sum | cut -c1-8)
            code=$(curl -sS -L -m 60 -A "$UA" -o out/eu/$n.body -w '%{http_code} %{content_type} %{size_download}' "$u" || echo fail)
            echo "$n $code $u" | tee -a out/eu/probe.txt
          done
          for f in out/eu/*.body; do echo "== $f"; grep -oiE 'https?://[^"'"'"' <>]+\.(csv|xlsx?|json|zip)[^"'"'"' <>]*|[^"'"'"' <>]*(download|export)[^"'"'"' <>]*' "$f" | sort -u | head -25; done | tee out/eu/links.txt
      - name: Fetch EU active substances (official API v3)
        run: |
          UA="AlMustashar-datafetch/1.0 (bob66aker@gmail.com)"
          curl -sS -L -m 180 -A "$UA" -o out/eu/active-substances.json -D out/eu/active-substances.headers "https://api.datalake.sante.service.ec.europa.eu/sante/pesticides/active-substances-download?format=json&api-version=v3.0" -w 'EU %{http_code} %{content_type} %{size_download}\n' | tee -a out/eu/probe.txt
          head -c 1500 out/eu/active-substances.json; echo
      - name: Publish raw results
        run: |
          git config user.name data-fetch; git config user.email data-fetch@users.noreply.github.com
          git checkout --orphan data-fetch-results
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f out
          git commit -qm "data-fetch raw"
          git push -f origin data-fetch-results
