<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>OCR engine comparison harness (dev only — not shipped)</title>
<!--
  tests/ocr-compare.html — measurement page for tests/ocr-compare.mjs.
  Loads the PRODUCTION scripts (search-core, tesseract, ocr.js) unchanged,
  plus (for the alternative-engine experiment only) PaddleOCR from esm.sh.
  This page is a dev tool; it is NOT linked from the app and NOT precached.
-->
<script src="/src/search-core.js?v=6"></script>
<script src="/vendor/tesseract/tesseract.min.js?v=6"></script>
<script src="/src/ocr.js?v=6"></script>
<script src="https://cdn.jsdelivr.net/npm/@techstark/opencv-js@5.0.0-release.1/dist/opencv.js"></script>
<script type="importmap">
{
  "imports": {
    "@paddleocr/paddleocr-js": "https://cdn.jsdelivr.net/npm/@paddleocr/paddleocr-js@0.4.2/dist/index.mjs",
    "js-yaml": "https://cdn.jsdelivr.net/npm/js-yaml@4.3.2/dist/js-yaml.mjs",
    "clipper-lib": "https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/+esm",
    "@techstark/opencv-js": "data:text/javascript,export%20default%20self.cv%3B%20export%20const%20cv%20%3D%20self.cv%3B",
    "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.bundle.min.mjs"
  }
}
</script>
<script>
(function () {
  /* ---------- DBs + shared merge (production SearchCore, unchanged) ----- */
  async function loadDBs() {
    const specs = [
      ['libya-248', '/data/libya-248.json'], ['libya-500', '/data/libya-500.json'],
      ['eu', '/data/eu.json'], ['epa', '/data/epa.json']
    ];
    const sources = [];
    for (const [key, url] of specs) {
      const data = await (await fetch(url, { cache: 'no-store' })).json();
      sources.push({ key: key, rows: data.rows });
      for (const r of data.rows) r.source_key = key;   /* same as the app */
    }
    window.__sources = sources;
    window.__search = SearchCore.buildSearch(sources);
    OcrModule.setSearchRef(window.__search);
  }
  window.__loadDBs = loadDBs;

  const RANK = { 'libya-248': 0, 'libya-500': 1, eu: 2, epa: 3 };

  /* best-per-row merge — same policy as the production suite */
  function bestOf(cas, cands) {
    const byRow = new Map();
    const pushAll = list => (list || []).forEach(x => {
      const prev = byRow.get(x.r);
      if (!prev || x.s.v > prev.s.v) byRow.set(x.r, x);
    });
    for (const casn of cas) pushAll(window.__search(String(casn), true));
    for (const c of cands) pushAll(window.__search(String(c), false));
    const merged = [...byRow.values()];
    merged.sort((a, b) => (RANK[a.k] - RANK[b.k]) || (b.s.v - a.s.v));
    return merged;
  }
  window.__bestOf = bestOf;

  /* verdict exactly as users see it: confirmed = top score 100 */
  function verdictOf(merged) {
    if (!merged || !merged.length) return { verdict: 'none', name: '', db: '', score: 0 };
    const top = merged[0];
    return {
      verdict: top.s.v >= 100 ? 'confirmed' : 'unconfirmed',
      name: String(top.r.name || '').slice(0, 60),
      db: top.k, score: Math.round(top.s.v)
    };
  }

  /* ---------- canvas builders (same shapes as v2-suite) ---------------- */
  function AI(chem, pct) {
    return [
      { t: 'MAXXPRO 480 SC', size: 34, bold: true },
      { t: 'Suspension Concentrate', size: 20 },
      { t: 'ACTIVE INGREDIENT:', size: 24, bold: true },
      { t: chem + (pct ? ' ' + pct : ''), size: 26 },
      { t: 'OTHER INGREDIENTS: 60.0%', size: 22 },
      { t: 'EPA Reg. No. 264-1152', size: 20 },
      { t: 'Keep Out of Reach of Children', size: 20 }
    ];
  }
  window.__AI = AI;

  function labelCanvas(opts) {
    const c = document.createElement('canvas');
    const W = opts.W || 900, H = opts.H || 620;
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.fillStyle = opts.bg || '#f2f2ee';
    g.fillRect(0, 0, W, H);
    g.fillStyle = opts.fg || '#111';
    const F = '"DejaVu Sans", "Noto Sans", Arial, sans-serif';
    let y = 40;
    for (const L of (opts.lines || [])) {
      g.font = (L.bold ? 'bold ' : '') + (L.size || 26) + 'px ' + F;
      g.fillText(L.t, L.x || 30, y);
      y += (L.size || 26) + 14;
    }
    if (opts.rotate) {
      const swap = Math.abs(Math.abs(opts.rotate) % Math.PI - Math.PI / 2) < 1e-6;
      const r = document.createElement('canvas');
      r.width = swap ? H : W; r.height = swap ? W : H;
      const rg = r.getContext('2d');
      rg.translate(r.width / 2, r.height / 2);
      rg.rotate(opts.rotate);
      rg.drawImage(c, -W / 2, -H / 2);
      return r;
    }
    return c;
  }
  window.__labelCanvas = labelCanvas;

  function addNoise(c, amount) {
    const g = c.getContext('2d');
    const img = g.getImageData(0, 0, c.width, c.height);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const n = (Math.random() - 0.5) * amount;
      d[i] = Math.max(0, Math.min(255, d[i] + n));
      d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + n));
      d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + n));
    }
    g.putImageData(img, 0, 0);
    return c;
  }
  window.__addNoise = addNoise;

  function streakCanvas() {
    const c = document.createElement('canvas');
    c.width = 640; c.height = 480;
    const g = c.getContext('2d');
    g.fillStyle = '#777'; g.fillRect(0, 0, 640, 480);
    for (let i = 0; i < 260; i++) {
      const shade = 40 + Math.floor(Math.random() * 150);
      g.strokeStyle = 'rgb(' + shade + ',' + shade + ',' + shade + ')';
      g.lineWidth = 1 + Math.random() * 5;
      g.beginPath();
      const x = Math.random() * 640, y = Math.random() * 480;
      g.moveTo(x, y);
      g.lineTo(x + (Math.random() - 0.5) * 260, y + (Math.random() - 0.5) * 200);
      g.stroke();
    }
    return c;
  }
  window.__streakCanvas = streakCanvas;

  /* the four probe canvases (docs/ocr-arabic-hallucination-diagnosis.md) */
  function probeCanvas(kind) {
    const W = 800, H = 600;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    if (kind === 'blank') {
      g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
    } else if (kind === 'noise') {
      let s = 123456789;
      const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
      const id = g.createImageData(W, H);
      for (let i = 0; i < id.data.length; i += 4) {
        id.data[i] = rnd() * 256 | 0;
        id.data[i + 1] = rnd() * 256 | 0;
        id.data[i + 2] = rnd() * 256 | 0;
        id.data[i + 3] = 255;
      }
      g.putImageData(id, 0, 0);
    } else if (kind === 'logo') {
      g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
      g.strokeStyle = '#111111'; g.lineWidth = 6;
      g.beginPath(); g.arc(W / 2, 220, 120, 0, Math.PI * 2); g.stroke();
      g.beginPath();
      for (let x = 80; x <= 720; x += 8) {
        const y = 450 + Math.sin((x - 80) / 60) * 40;
        if (x === 80) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.stroke();
    } else if (kind === 'label') {
      g.fillStyle = '#f4f2ec'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#1c5c34'; g.fillRect(0, 0, W, 90);
      g.fillStyle = '#ffffff'; g.font = 'bold 34px sans-serif';
      g.fillText('AGROPLEX 480 EC', 24, 58);
      g.fillStyle = '#111111'; g.font = '22px sans-serif';
      g.fillText('ACTIVE INGREDIENT:', 24, 140);
      g.font = 'bold 26px sans-serif';
      g.fillText('CHLORPYRIFOS 480 g/L', 24, 175);
      g.font = '20px sans-serif';
      g.fillText('EMULSIFIABLE CONCENTRATE', 24, 210);
      g.fillText('NET CONTENT: 1 L', 24, 245);
      for (let x = 24; x < 776; x += 6) {
        const bh = 30 + ((x * 7) % 3) * 12;
        g.fillStyle = '#000000';
        if ((x / 6 | 0) % 2 === 0) g.fillRect(x, 290, 3, bh);
      }
      g.fillStyle = '#c8a028'; g.fillRect(0, 360, W, 50);
      g.fillStyle = '#111111'; g.font = '18px sans-serif';
      g.fillText('KEEP OUT OF REACH OF CHILDREN', 24, 392);
      g.strokeStyle = '#333333'; g.lineWidth = 4;
      g.beginPath(); g.arc(700, 430, 55, 0, Math.PI * 2); g.stroke();
      g.font = '16px sans-serif';
      g.fillText('Batch no. 2341A  EXP 09/2028', 24, 470);
      g.fillText('Reg. no. EPA-4787-XX', 24, 505);
    }
    return c;
  }
  window.__probeCanvas = probeCanvas;

  function canvasToBlob(c) { return new Promise(res => c.toBlob(res, 'image/png')); }

  function buildCaseCanvas(spec) {
    if (spec.probe) return probeCanvas(spec.probe);
    if (spec.streaks) return streakCanvas();
    let c = labelCanvas(spec);
    if (spec.noise) c = addNoise(c, spec.noise);
    return c;
  }
  window.__buildCaseCanvas = buildCaseCanvas;

  /* ---------- engine 1: production pipeline ----------------------------- */
  window.__compareRun = async function (spec) {
    const canvas = buildCaseCanvas(spec);
    const blob = await canvasToBlob(canvas);
    const file = new File([blob], spec.name + '.png', { type: 'image/png' });
    const t0 = performance.now();
    let res;
    try { res = await OcrModule.recognize(file, null, { search: window.__search }); }
    catch (e) { return { name: spec.name, engine: 'current', error: String((e && e.message) || e).slice(0, 160) }; }
    const ms = Math.round(performance.now() - t0);
    const merged = bestOf(res.cas || [], res.candidates || []);
    const v = verdictOf(merged);
    const AR = /[\u0600-\u06FF]/g;
    return {
      name: spec.name, engine: 'current', ms: ms,
      verdict: res.rejected ? 'rejected' : v.verdict,
      rejected: res.rejected ? res.rejected.key : null,
      name: spec.name, top: v.name, db: v.db, score: v.score,
      cas: (res.cas || []).slice(0, 4),
      conf: res.confidence == null ? null : Math.round(res.confidence),
      passes: res.passes || 0, textLen: String(res.text || '').length,
      arabic: (String(res.text || '').match(AR) || []).length
    };
  };

  window.__compareLabel = async function (imgName) {
    const blob = await (await fetch('/tests/fixtures/labels/' + encodeURIComponent(imgName), { cache: 'no-store' })).blob();
    const file = new File([blob], imgName, { type: blob.type || 'image/jpeg' });
    const t0 = performance.now();
    let res;
    try { res = await OcrModule.recognize(file, null, { search: window.__search }); }
    catch (e) { return { name: imgName, engine: 'current', error: String((e && e.message) || e).slice(0, 160) }; }
    const ms = Math.round(performance.now() - t0);
    const merged = bestOf(res.cas || [], res.candidates || []);
    const v = verdictOf(merged);
    const AR = /[\u0600-\u06FF]/g;
    return {
      name: imgName, engine: 'current', ms: ms,
      verdict: res.rejected ? 'rejected' : v.verdict,
      rejected: res.rejected ? res.rejected.key : null,
      top: v.name, db: v.db, score: v.score,
      cas: (res.cas || []).slice(0, 4),
      conf: res.confidence == null ? null : Math.round(res.confidence),
      passes: res.passes || 0, textLen: String(res.text || '').length,
      arabic: (String(res.text || '').match(AR) || []).length,
      raw: String(res.text || '').replace(/\s+/g, ' ').trim().slice(0, 200)
    };
  };

  /* ---------- engine 2: PaddleOCR PP-OCRv5 (experiment only) ------------ */
  /* Loaded by the module script below once esm.sh responds; it fills
   * window.__paddleRun / window.__paddleLabel and sets window.__paddleReady. */
  window.__paddleReady = false;
})();
</script>
<script type="module">
/* Alternative-engine measurement path (Phase A only, never shipped):
 * PaddleOCR PP-OCRv5 mobile det+rec, ONNX Runtime Web WASM backend. */
try {
  const { PaddleOCR } = await import('@paddleocr/paddleocr-js');
  const ocr = await PaddleOCR.create({
    lang: 'en', ocrVersion: 'PP-OCRv5',
    ortOptions: { backend: 'wasm' }
  });
  window.__paddleOCR = ocr;

  function paddleText(result) {
    return (result.items || []).map(it => ({ t: String(it.text || ''), s: +it.score || 0 }));
  }

  window.__paddleRun = async function (spec) {
    const canvas = window.__buildCaseCanvas(spec);
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    const t0 = performance.now();
    let results;
    try { results = await window.__paddleOCR.predict(blob); }
    catch (e) { return { name: spec.name, engine: 'paddle', error: String((e && e.message) || e).slice(0, 160) }; }
    const ms = Math.round(performance.now() - t0);
    const items = paddleText(results[0] || { items: [] });
    const text = items.map(i => i.t).join('\n');
    /* SAME production extraction as the current engine arm: the raw paddle
     * text goes through OcrModule.extractCAS + extractCandidates so the only
     * variable between the two arms is the TEXT SOURCE, not the candidate
     * pipeline (word-splitting/grams/junk filter are part of production). */
    const cas = OcrModule.extractCAS(text) || [];
    const cands = OcrModule.extractCandidates(text, { filterJunk: true }) || [];
    const merged = window.__bestOf(cas, cands);
    const v = (() => {
      if (!merged.length) return { verdict: 'none', name: '', db: '', score: 0 };
      const top = merged[0];
      return { verdict: top.s.v >= 100 ? 'confirmed' : 'unconfirmed', name: String(top.r.name || '').slice(0, 60), db: top.k, score: Math.round(top.s.v) };
    })();
    const AR = /[\u0600-\u06FF]/g;
    const scores = items.map(i => i.s).filter(s => s > 0);
    return {
      name: spec.name, engine: 'paddle', ms: ms,
      verdict: v.verdict, top: v.name, db: v.db, score: v.score,
      cas: cas.slice(0, 4),
      conf: scores.length ? Math.round(100 * scores.reduce((a, b) => a + b, 0) / scores.length) : 0,
      lines: items.length, textLen: text.length,
      arabic: (text.match(AR) || []).length
    };
  };

  window.__paddleLabel = async function (imgName) {
    const blob = await (await fetch('/tests/fixtures/labels/' + encodeURIComponent(imgName), { cache: 'no-store' })).blob();
    const t0 = performance.now();
    let results;
    try { results = await window.__paddleOCR.predict(blob); }
    catch (e) { return { name: imgName, engine: 'paddle', error: String((e && e.message) || e).slice(0, 160) }; }
    const ms = Math.round(performance.now() - t0);
    const items = paddleText(results[0] || { items: [] });
    const text = items.map(i => i.t).join('\n');
    /* same production extraction as __paddleRun (identical-merge fairness) */
    const cas = OcrModule.extractCAS(text) || [];
    const cands = OcrModule.extractCandidates(text, { filterJunk: true }) || [];
    const merged = window.__bestOf(cas, cands);
    const top = merged[0];
    const AR = /[\u0600-\u06FF]/g;
    const scores = items.map(i => i.s).filter(s => s > 0);
    return {
      name: imgName, engine: 'paddle', ms: ms,
      verdict: !merged.length ? 'none' : (top.s.v >= 100 ? 'confirmed' : 'unconfirmed'),
      top: top ? String(top.r.name || '').slice(0, 60) : '',
      db: top ? top.k : '', score: top ? Math.round(top.s.v) : 0,
      cas: cas.slice(0, 4),
      conf: scores.length ? Math.round(100 * scores.reduce((a, b) => a + b, 0) / scores.length) : 0,
      lines: items.length, textLen: text.length,
      arabic: (text.match(AR) || []).length,
      raw: text.replace(/\s+/g, ' ').trim().slice(0, 200)
    };
  };

  window.__paddleReady = true;
  console.log('[compare] paddle ready');
} catch (e) {
  console.log('[compare] paddle boot FAILED: ' + String((e && e.message) || e).slice(0, 300));
}
</script>
</head>
<body>
<div id="status">comparison harness — drive from tests/ocr-compare.mjs</div>
</body>
</html>
